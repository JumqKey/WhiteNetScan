[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whitenetscan"
version = "1.1.4"
description = "WhiteNetScan Powered By Freedom"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
scan = "whitenetscan.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
